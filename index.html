<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip It">
<meta name="theme-color" content="#0a0a12">
<title>Flip It — Yes or No</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a12;
    --surface: #13131f;
    --border: rgba(255,255,255,0.07);
    --gold: #d4a843;
    --gold-light: #f0c96a;
    --gold-dark: #a07820;
    --silver: #c0c8d8;
    --silver-dark: #7a8499;
    --yes: #4ade80;
    --no: #f87171;
    --text: #e8e8f0;
    --muted: #6b6b88;
    --radius: 20px;
    --coin-size: 200px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,168,67,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(74,222,128,0.05) 0%, transparent 60%),
      var(--bg);
    gap: 0;
  }

  /* ── Header ── */
  .header {
    width: 100%;
    text-align: center;
    padding-top: 10px;
    padding-bottom: 8px;
    flex-shrink: 0;
  }

  .app-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .app-sub {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 1px;
  }

  /* ── Question Box ── */
  .question-wrap {
    width: 100%;
    max-width: 380px;
    margin-top: 14px;
    flex-shrink: 0;
  }

  .question-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    padding-left: 2px;
  }

  .question-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    resize: none;
    line-height: 1.4;
    min-height: 52px;
    max-height: 90px;
  }

  .question-input::placeholder { color: var(--muted); }
  .question-input:focus {
    border-color: rgba(212,168,67,0.4);
    box-shadow: 0 0 0 3px rgba(212,168,67,0.08);
  }

  /* ── Coin Stage ── */
  .coin-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 24px;
    min-height: 0;
  }

  .coin-scene {
    width: var(--coin-size);
    height: var(--coin-size);
    perspective: 700px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }

  .coin {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.05s;
    filter: drop-shadow(0 8px 32px rgba(212,168,67,0.3));
  }

  .coin.flipping {
    animation: coinFlip 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  .coin.result-yes  { transform: rotateY(0deg); }
  .coin.result-no   { transform: rotateY(180deg); }

  @keyframes coinFlip {
    0%   { transform: rotateY(0deg) rotateX(0deg) scale(1); }
    20%  { transform: rotateY(180deg) rotateX(20deg) scale(1.08); }
    40%  { transform: rotateY(540deg) rotateX(-10deg) scale(1.12); }
    60%  { transform: rotateY(900deg) rotateX(15deg) scale(1.08); }
    80%  { transform: rotateY(1180deg) rotateX(-5deg) scale(1.04); }
    100% { transform: rotateY(var(--final-rotation)) rotateX(0deg) scale(1); }
  }

  .coin-face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
  }

  /* YES face (front) */
  .coin-yes {
    background: radial-gradient(circle at 35% 35%, #f5d98a, #d4a843 45%, #8a6520 100%);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.4),
      0 0 0 6px #b8862a,
      0 0 0 8px #d4a843,
      0 0 0 12px rgba(212,168,67,0.15);
  }

  /* NO face (back) */
  .coin-no {
    background: radial-gradient(circle at 35% 35%, #dde4f0, #b0bdd4 45%, #60708a 100%);
    transform: rotateY(180deg);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.5),
      inset 0 -3px 6px rgba(0,0,0,0.35),
      0 0 0 6px #8090ac,
      0 0 0 8px #b0bdd4,
      0 0 0 12px rgba(176,189,212,0.15);
  }

  .coin-word {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .coin-yes .coin-word { color: #3a2000; text-shadow: 0 1px 2px rgba(255,255,255,0.3); }
  .coin-no  .coin-word { color: #1e2535; text-shadow: 0 1px 2px rgba(255,255,255,0.4); }

  .coin-ring {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    pointer-events: none;
  }

  /* ── Answer Display ── */
  .answer-display {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answer-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    opacity: 0;
    transform: translateY(8px) scale(0.95);
    transition: opacity 0.4s ease, transform 0.4s ease;
    letter-spacing: 0.05em;
  }

  .answer-text.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .answer-text.yes { color: var(--yes); }
  .answer-text.no  { color: var(--no);  }

  /* ── Flip Button ── */
  .flip-btn {
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    border: none;
    border-radius: 50px;
    padding: 15px 48px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    color: #1a0e00;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    box-shadow: 0 4px 24px rgba(212,168,67,0.35);
    -webkit-appearance: none;
  }

  .flip-btn:active { transform: scale(0.96); box-shadow: 0 2px 12px rgba(212,168,67,0.2); }
  .flip-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Stats ── */
  .stats {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1;
  }

  .stat-num.yes { color: var(--yes); }
  .stat-num.no  { color: var(--no);  }
  .stat-num.total { color: var(--muted); }

  .stat-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 3px;
  }

  .stat-divider {
    width: 1px;
    height: 32px;
    background: var(--border);
  }

  /* ── Quote ── */
  .quote-wrap {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    flex-shrink: 0;
    margin-bottom: 4px;
  }

  .quote-eyebrow {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
    opacity: 0.8;
  }

  .quote-text {
    font-size: 0.82rem;
    line-height: 1.55;
    color: var(--text);
    font-style: italic;
    opacity: 0.85;
  }

  .quote-author {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 5px;
  }

  .quote-loading {
    color: var(--muted);
    font-size: 0.82rem;
    font-style: italic;
  }

  /* ── Ripple ── */
  .ripple {
    position: fixed;
    border-radius: 50%;
    transform: scale(0);
    animation: ripple-anim 0.6s linear;
    background: rgba(212,168,67,0.15);
    pointer-events: none;
  }

  @keyframes ripple-anim {
    to { transform: scale(4); opacity: 0; }
  }

  /* ── Shimmer on result ── */
  @keyframes shimmer {
    0%   { filter: drop-shadow(0 8px 32px rgba(212,168,67,0.3)); }
    50%  { filter: drop-shadow(0 8px 48px rgba(212,168,67,0.6)) drop-shadow(0 0 20px rgba(212,168,67,0.4)); }
    100% { filter: drop-shadow(0 8px 32px rgba(212,168,67,0.3)); }
  }

  .coin.landed { animation: shimmer 2s ease-in-out 0.2s 2; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="app-title">Flip It</div>
  <div class="app-sub">Yes or No · Let fate decide</div>
</div>

<!-- Question Input -->
<div class="question-wrap">
  <div class="question-label">Your Question</div>
  <textarea class="question-input" placeholder="Should I…?" rows="2" maxlength="200" id="questionInput"></textarea>
</div>

<!-- Coin + Controls -->
<div class="coin-stage">

  <!-- Coin -->
  <div class="coin-scene" id="coinScene" onclick="flipCoin()">
    <div class="coin result-yes" id="coin">
      <div class="coin-face coin-yes">
        <div class="coin-ring"></div>
        <div class="coin-word">YES</div>
      </div>
      <div class="coin-face coin-no">
        <div class="coin-ring"></div>
        <div class="coin-word">NO</div>
      </div>
    </div>
  </div>

  <!-- Answer -->
  <div class="answer-display">
    <div class="answer-text" id="answerText">Tap to flip</div>
  </div>

  <!-- Flip Button -->
  <button class="flip-btn" id="flipBtn" onclick="flipCoin()">Flip the Coin</button>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-num yes" id="yesCount">0</div>
      <div class="stat-label">Yes</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-num total" id="totalCount">0</div>
      <div class="stat-label">Flips</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-num no" id="noCount">0</div>
      <div class="stat-label">No</div>
    </div>
  </div>

</div>

<!-- Quote of the Day -->
<div class="quote-wrap">
  <div class="quote-eyebrow">✦ Quote of the Day</div>
  <div class="quote-text quote-loading" id="quoteText">Loading today's wisdom…</div>
  <div class="quote-author" id="quoteAuthor"></div>
</div>

<script>
  // ── State ──────────────────────────────────────────────
  let yesCount = 0, noCount = 0, totalCount = 0;
  let isFlipping = false;
  let lastResult = 'yes';

  const coin      = document.getElementById('coin');
  const flipBtn   = document.getElementById('flipBtn');
  const answerEl  = document.getElementById('answerText');
  const yesEl     = document.getElementById('yesCount');
  const noEl      = document.getElementById('noCount');
  const totalEl   = document.getElementById('totalCount');

  // ── Coin Flip ──────────────────────────────────────────
  function flipCoin() {
    if (isFlipping) return;
    isFlipping = true;
    flipBtn.disabled = true;

    // Hide answer
    answerEl.className = 'answer-text';
    answerEl.textContent = '';

    const result = Math.random() < 0.5 ? 'yes' : 'no';
    lastResult = result;

    // Set CSS variable for final rotation
    // YES = 0deg (or 720, 1440…), NO = 180deg (or 900, 1260…)
    const baseSpins = 1080; // 3 full rotations
    const finalAngle = result === 'yes' ? baseSpins : baseSpins + 180;
    coin.style.setProperty('--final-rotation', finalAngle + 'deg');

    // Remove previous classes, trigger flip
    coin.className = 'coin flipping';

    setTimeout(() => {
      // Snap to correct face
      coin.classList.remove('flipping');
      coin.classList.add(result === 'yes' ? 'result-yes' : 'result-no');
      coin.classList.add('landed');

      // Show answer
      answerEl.textContent = result === 'yes' ? '✓ Yes!' : '✗ No';
      answerEl.className = `answer-text visible ${result}`;

      // Stats
      if (result === 'yes') yesCount++;
      else noCount++;
      totalCount++;
      yesEl.textContent   = yesCount;
      noEl.textContent    = noCount;
      totalEl.textContent = totalCount;

      isFlipping = false;
      flipBtn.disabled = false;
    }, 1220);
  }

  // Remove landed class so shimmer can replay
  coin.addEventListener('animationend', (e) => {
    if (e.animationName === 'shimmer') {
      coin.classList.remove('landed');
    }
  });

  // Tap on coin also triggers flip
  let touchMoved = false;
  document.getElementById('coinScene').addEventListener('touchstart', () => touchMoved = false);
  document.getElementById('coinScene').addEventListener('touchmove', () => touchMoved = true);
  document.getElementById('coinScene').addEventListener('touchend', (e) => {
    if (!touchMoved) { e.preventDefault(); flipCoin(); }
  }, { passive: false });

  // ── Quote of the Day ───────────────────────────────────
  async function loadQuote() {
    const cacheKey  = 'flipit_quote';
    const cacheDate = 'flipit_quote_date';
    const today     = new Date().toDateString();
    const quoteEl   = document.getElementById('quoteText');
    const authorEl  = document.getElementById('quoteAuthor');

    // Serve from cache if same day
    const cached = localStorage.getItem(cacheKey);
    const cachedDate = localStorage.getItem(cacheDate);
    if (cached && cachedDate === today) {
      const q = JSON.parse(cached);
      quoteEl.textContent = `"${q.q}"`;
      quoteEl.classList.remove('quote-loading');
      authorEl.textContent = `— ${q.a}`;
      return;
    }

    try {
      const res  = await fetch('https://zenquotes.io/api/today');
      const data = await res.json();
      const q    = data[0];
      localStorage.setItem(cacheKey,  JSON.stringify(q));
      localStorage.setItem(cacheDate, today);
      quoteEl.textContent = `"${q.q}"`;
      quoteEl.classList.remove('quote-loading');
      authorEl.textContent = `— ${q.a}`;
    } catch {
      // Fallback quotes if API fails / offline
      const fallbacks = [
        { q: "The universe is under no obligation to make sense to you.", a: "Neil deGrasse Tyson" },
        { q: "Indecision is the thief of opportunity.", a: "Jim Rohn" },
        { q: "When in doubt, flip a coin. At least you'll know what you were hoping for.", a: "Unknown" },
        { q: "Sometimes the smallest decision can change your life forever.", a: "Keri Russell" },
      ];
      const f = fallbacks[Math.floor(Math.random() * fallbacks.length)];
      quoteEl.textContent = `"${f.q}"`;
      quoteEl.classList.remove('quote-loading');
      authorEl.textContent = `— ${f.a}`;
    }
  }

  loadQuote();

  // ── PWA: Initial answer hint ──────────────────────────
  answerEl.textContent = 'Tap to flip';
  answerEl.style.opacity = '0.35';
  answerEl.style.fontSize = '0.9rem';
  answerEl.style.fontFamily = "'DM Sans', sans-serif";
  answerEl.style.color = 'var(--muted)';
  answerEl.style.transform = 'none';
  answerEl.style.opacity = '1';

  // Reset to clean state on first flip
  const origFlip = flipCoin;
  // (already clean — hint is just inline styled text)

</script>

<!-- PWA Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'flipit-v1';
    const ASSETS = ['/'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
      self.skipWaiting();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        fetch(e.request).catch(() => caches.match(e.request))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>

<!-- PWA Manifest -->
<script>
const manifest = {
  name: "Flip It — Yes or No",
  short_name: "Flip It",
  start_url: ".",
  display: "standalone",
  background_color: "#0a0a12",
  theme_color: "#0a0a12",
  orientation: "portrait",
  icons: [{
    src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%230a0a12'/><circle cx='256' cy='256' r='180' fill='%23d4a843'/><circle cx='256' cy='256' r='160' fill='none' stroke='%23f0c96a' stroke-width='8'/><text x='256' y='300' text-anchor='middle' font-family='Georgia,serif' font-size='120' font-weight='900' fill='%231a0e00'>Y</text></svg>`),
    sizes: "512x512",
    type: "image/svg+xml"
  }]
};
const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
const url  = URL.createObjectURL(blob);
const link = document.createElement('link');
link.rel   = 'manifest';
link.href  = url;
document.head.appendChild(link);
</script>

</body>
</html>
