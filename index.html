<!DOCTYPE html>
<html lang="en">
<head>

<!-- ============================================================
  CHARACTER ENCODING & VIEWPORT
  charset: tells the browser this file uses UTF-8 text encoding
           (supports all standard characters and symbols)
  viewport: scales the page to the device screen width.
            "viewport-fit=cover" extends into iPhone notch/home
            bar areas so the app fills edge-to-edge.
============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- ============================================================
  PWA (PROGRESSIVE WEB APP) META TAGS — iPhone specific
  These are what make "Add to Home Screen" behave like a real app.

  apple-mobile-web-app-capable:
    Tells iOS to run the page in full-screen standalone mode
    (no Safari address bar or navigation buttons visible).

  apple-mobile-web-app-status-bar-style:
    "black-translucent" makes the iPhone status bar (time,
    battery, signal) transparent and overlays it on the app,
    giving a true full-bleed look.

  apple-mobile-web-app-title:
    The label that appears under the icon on the home screen.

  theme-color:
    Sets the browser chrome color on Android PWAs and some
    iOS versions. Matches the dark app background.
============================================================ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip It">
<meta name="theme-color" content="#0a0a12">

<title>Flip It — Yes or No</title>

<!-- ============================================================
  GOOGLE FONTS
  "preconnect" opens the connection to Google's server early
  so fonts load faster. We load two typefaces:
    - Playfair Display: elegant serif for the coin text & title
    - DM Sans: clean modern sans-serif for UI labels & body text
  weights 300/400/500/700/900 give us thin through ultra-bold.
============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

  /* ==========================================================
    CSS CUSTOM PROPERTIES (VARIABLES)
    Defined on :root so every element in the page can use them.
    Centralising colours here means changing --gold in one place
    updates every gold element automatically.
  ========================================================== */
  :root {
    --bg:          #0a0a12;           /* deep navy-black page background */
    --surface:     #13131f;           /* slightly lighter surface for cards/inputs */
    --border:      rgba(255,255,255,0.07); /* very subtle white border */
    --gold:        #d4a843;           /* mid gold — coin base colour */
    --gold-light:  #f0c96a;           /* lighter gold for highlights & gradients */
    --gold-dark:   #a07820;           /* darker gold for shadows & depth */
    --silver:      #c0c8d8;           /* silver tone for the NO face */
    --silver-dark: #7a8499;           /* darker silver for NO face shadow */
    --yes:         #4ade80;           /* green used for YES result text */
    --no:          #f87171;           /* red used for NO result text */
    --text:        #e8e8f0;           /* off-white main text colour */
    --muted:       #6b6b88;           /* dimmed purple-grey for labels/hints */
    --radius:      20px;              /* default border-radius (unused directly, reference) */
    --coin-size:   200px;             /* diameter of the coin — change here to resize it */
  }

  /* ==========================================================
    GLOBAL RESET
    Removes default browser margin/padding from every element.
    box-sizing: border-box means padding is included inside
    the element's declared width/height (much more predictable).
    -webkit-tap-highlight-color: transparent removes the grey
    flash that iOS shows when you tap a touchable element.
  ========================================================== */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  /* ==========================================================
    HTML & BODY BASE STYLES
    overflow: hidden prevents the page from scrolling — the
    whole app fits within the viewport height.
    -webkit-font-smoothing: antialiased makes text look crisper
    on Mac/iOS by using subpixel font rendering.
  ========================================================== */
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ==========================================================
    BODY LAYOUT
    Flexbox column stacks all sections top-to-bottom and
    centres them horizontally.

    min-height: 100dvh — "dvh" is "dynamic viewport height",
    which on iOS correctly accounts for the collapsing Safari
    address bar. Regular "vh" can be slightly wrong on mobile.

    padding: env(safe-area-inset-*) — pulls padding values
    from the iPhone's hardware notch/home bar dimensions so
    content is never hidden behind them.

    background: three layers stacked on top of each other:
      1. A gold elliptical glow bleeding in from the top
      2. A faint green glow bleeding in from the bottom-right
      3. The solid dark background colour
    This gives subtle atmospheric depth without being distracting.
  ========================================================== */
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,168,67,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(74,222,128,0.05) 0%, transparent 60%),
      var(--bg);
    gap: 0;
  }

  /* ── Header ── */
  .header {
    width: 100%;
    text-align: center;
    padding-top: 10px;
    padding-bottom: 8px;
    flex-shrink: 0; /* prevents the header compressing when space is tight */
  }

  /* Gold gradient text effect for the app title.
     The trick: apply a gradient as the background, clip it to
     the text shape, then make the text colour transparent so
     the gradient background shows through instead. */
  .app-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    -webkit-background-clip: text;   /* clips gradient to text outline (Safari/Chrome) */
    -webkit-text-fill-color: transparent; /* hides the actual text colour */
    background-clip: text;           /* standard version of the same property */
  }

  .app-sub {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.18em;  /* wide tracking gives it a refined label feel */
    text-transform: uppercase;
    margin-top: 1px;
  }

  /* ── Question Input Box ── */
  .question-wrap {
    width: 100%;
    max-width: 380px;
    margin-top: 28px;     /* more breathing room below the header */
    margin-bottom: 12px;  /* separation from the coin stage below */
    flex-shrink: 0;
  }

  .question-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    padding-left: 2px;
  }

  /* Textarea styled to look like a native dark input field.
     -webkit-appearance: none removes iOS's default input styling.
     resize: none prevents the user dragging to resize the box. */
  .question-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    resize: none;
    line-height: 1.4;
    min-height: 52px;
    max-height: 90px;
  }

  .question-input::placeholder { color: var(--muted); }

  /* Gold glow ring when the input is focused (tapped) */
  .question-input:focus {
    border-color: rgba(212,168,67,0.4);
    box-shadow: 0 0 0 3px rgba(212,168,67,0.08);
  }


  /* ==========================================================
    COIN STAGE — the centre section containing the coin,
    answer text, button and stats.
    flex: 1 makes it expand to fill all remaining vertical
    space between the header/input and the quote at the bottom.
    min-height: 0 is required on flex children that also use
    flex:1, otherwise they can overflow the container on iOS.
  ========================================================== */
  .coin-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 34px;            /* more space between coin, button and stats */
    padding-top: 8px;     /* a little extra room at the top of the stage */
    min-height: 0;
  }


  /* ==========================================================
    COIN SCENE — the outer wrapper that creates the 3D space.

    HOW 3D CSS WORKS:
    Think of .coin-scene as a camera pointing at the coin.
    "perspective" controls how much depth/foreshortening the
    camera sees — lower values = more dramatic 3D effect,
    higher values = flatter/more subtle. 700px is a moderate
    realistic perspective.

    -webkit-perspective is the Safari-prefixed version —
    Safari requires both to apply 3D perspective correctly.

    The scene itself does NOT rotate. Only the coin inside it
    rotates. The scene just defines the 3D viewing angle.
  ========================================================== */
  .coin-scene {
    width: var(--coin-size);
    height: var(--coin-size);
    perspective: 700px;          /* 3D depth — how "far away" the camera is */
    -webkit-perspective: 700px;  /* required for Safari / iOS */
    cursor: pointer;
    user-select: none;           /* prevents text selection on click-drag */
    -webkit-user-select: none;   /* Safari version of the same */
    /* The glow lives HERE, not on .coin. Applying a filter to the
       rotating .coin (which has preserve-3d) would flatten its faces
       into 2D and break backface-visibility — the cause of the NO
       face never showing. .coin-scene does NOT rotate, so the filter
       is safe here. */
    filter: drop-shadow(0 8px 32px rgba(212,168,67,0.3));
  }


  /* ==========================================================
    COIN — the rotating container that holds both faces.

    transform-style: preserve-3d is the KEY property that makes
    this work. It tells the browser: "keep the children of this
    element in genuine 3D space." Without it, the browser would
    flatten everything to 2D and the backface trick wouldn't work.

    -webkit-transform-style: preserve-3d is the Safari prefix —
    iOS Safari REQUIRES this or the coin faces collapse flat.

    IMPORTANT: there is deliberately NO filter/opacity/clip-path on
    this element. The gold glow (drop-shadow) lives on .coin-scene
    instead, because any of those properties on a preserve-3d element
    flattens its children and breaks the two-sided coin.

    transition: transform 0.05s gives a tiny snap when the coin
    settles to its final resting rotation after the animation ends.
  ========================================================== */
  .coin {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;          /* enables true 3D for children */
    -webkit-transform-style: preserve-3d;  /* Safari / iOS — absolutely required */
    transition: transform 0.05s;
    /* NOTE: no filter/opacity/clip-path here — any of those would
       flatten the 3D children and break the two-sided coin. */
  }

  /* Class added while the flip animation is running */
  .coin.flipping {
    /* cubic-bezier(0.4, 0, 0.2, 1) = Material Design "standard" easing.
       Starts quick, eases out slowly — feels like a real physical throw. */
    animation: coinFlip 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  /* Static resting positions after the animation completes.
     YES face = 0deg rotation (front facing us)
     NO face  = 180deg rotation (flipped to show back face) */
  .coin.result-yes { transform: rotateY(0deg); }
  .coin.result-no  { transform: rotateY(180deg); }


  /* ==========================================================
    COIN FLIP KEYFRAME ANIMATION

    This animates the coin rotating on its Y axis (like a coin
    spinning on a table edge) while also rocking on the X axis
    (tilting forward/back) to simulate a tumbling throw.

    rotateY: the main spinning rotation — goes from 0 to 1080+
             degrees (3+ full spins) before landing.

    rotateX: the wobble — small positive/negative tilts that make
             the coin look like it's tumbling through the air,
             not just spinning perfectly flat.

    scale: grows slightly at the peak of the arc (simulating the
           coin rising toward you) then shrinks back to 1 as it
           "lands."

    --final-rotation: a CSS variable set by JavaScript just before
           the animation starts. It's either 1080deg (lands on YES)
           or 1260deg (lands on NO = 1080 + 180). This is how the
           animation knows which face to end on.

    "forwards" on the animation means: hold the final keyframe
           state instead of snapping back to the start.
  ========================================================== */
  @keyframes coinFlip {
    0%   { transform: rotateY(0deg)    rotateX(0deg)   scale(1);    } /* starting position */
    20%  { transform: rotateY(180deg)  rotateX(20deg)  scale(1.08); } /* first half-spin, tilting forward */
    40%  { transform: rotateY(540deg)  rotateX(-10deg) scale(1.12); } /* 1.5 spins, peak height */
    60%  { transform: rotateY(900deg)  rotateX(15deg)  scale(1.08); } /* 2.5 spins, coming down */
    80%  { transform: rotateY(1180deg) rotateX(-5deg)  scale(1.04); } /* nearly landed, small wobble */
    100% { transform: rotateY(var(--final-rotation)) rotateX(0deg) scale(1); } /* final resting face */
  }


  /* ==========================================================
    COIN FACE — shared styles for both YES and NO sides.

    position: absolute + inset: 0 makes each face fill the
    entire coin container and stack exactly on top of each other.

    border-radius: 50% makes the square div into a circle.

    backface-visibility: hidden is the CORE trick for two-sided
    coins. When a face is rotated more than 90deg away from the
    camera (i.e., pointing away from the viewer), this property
    makes it invisible. Without it, you'd see both faces at once
    — the front face showing through from behind.

    -webkit-backface-visibility is the Safari prefix. iOS Safari
    REQUIRES this or the backface hiding doesn't work at all,
    which is exactly why you saw YES on both sides originally.

    will-change: transform hints to the browser to pre-allocate
    a GPU layer for this element, ensuring smooth animation.
    Without a dedicated GPU layer, Safari can sometimes ignore
    backface-visibility.
  ========================================================== */
  .coin-face {
    position: absolute;
    inset: 0;                              /* fills the parent container */
    border-radius: 50%;                    /* circle shape */
    backface-visibility: hidden;           /* hide when rotated away from camera */
    -webkit-backface-visibility: hidden;   /* Safari / iOS — critical for the trick to work */
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    will-change: transform;               /* tells the GPU to prep a layer for this element */
  }


  /* ==========================================================
    YES FACE (front of coin) — gold appearance.

    transform: rotateY(0deg) — faces directly toward the viewer.
    translateZ(1px) pushes it 1px toward the camera. This tiny
    offset forces Safari to place it on its own GPU compositing
    layer, which is what makes backface-visibility actually work
    on iOS. Without it, Safari collapses both faces onto the same
    layer and you see through them.

    background radial-gradient: simulates a light source hitting
    a metallic surface from the upper-left. Goes from light gold
    (#f5d98a) at the highlight point → mid gold → dark bronze at
    the edges, creating a 3D rounded metal look.

    box-shadow layers (read inside-out):
      inset 0 2px 4px white   → bright highlight at the top edge
      inset 0 -3px 6px black  → shadow at the bottom edge (depth)
      0 0 0 6px dark-gold     → inner ring border (coin rim)
      0 0 0 8px mid-gold      → outer ring border
      0 0 0 12px gold-glow    → soft outer glow halo
  ========================================================== */
  .coin-yes {
    background: radial-gradient(
      circle at 35% 35%,  /* light source position: upper-left */
      #f5d98a,            /* bright gold at the highlight */
      #d4a843 45%,        /* mid gold */
      #8a6520 100%        /* dark bronze at the edges */
    );
    -webkit-transform: rotateY(0deg) translateZ(1px);  /* Safari GPU layer fix */
    transform: rotateY(0deg) translateZ(1px);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.4),  /* top highlight */
      inset 0 -3px 6px rgba(0,0,0,0.4),       /* bottom shadow */
      0 0 0 6px #b8862a,                       /* dark coin rim */
      0 0 0 8px #d4a843,                       /* gold rim highlight */
      0 0 0 12px rgba(212,168,67,0.15);        /* outer glow */
  }


  /* ==========================================================
    NO FACE (back of coin) — silver/steel appearance.

    transform: rotateY(180deg) — pre-rotated 180 degrees so it
    starts facing AWAY from the viewer (hidden behind the YES face).
    When the coin flips 180deg, this face comes around to face
    the viewer while the YES face turns away and disappears.

    translateZ(1px) — same GPU layer fix as the YES face.

    Same box-shadow structure as YES but using silver tones
    instead of gold to visually distinguish the two sides.
  ========================================================== */
  .coin-no {
    background: radial-gradient(
      circle at 35% 35%,  /* same light source angle for consistency */
      #dde4f0,            /* light silver at highlight */
      #b0bdd4 45%,        /* mid silver */
      #60708a 100%        /* dark steel at edges */
    );
    -webkit-transform: rotateY(180deg) translateZ(1px);  /* pre-rotated to back */
    transform: rotateY(180deg) translateZ(1px);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.5),  /* top highlight (brighter on silver) */
      inset 0 -3px 6px rgba(0,0,0,0.35),      /* bottom shadow */
      0 0 0 6px #8090ac,                       /* dark steel rim */
      0 0 0 8px #b0bdd4,                       /* silver rim highlight */
      0 0 0 12px rgba(176,189,212,0.15);       /* outer glow (silver-blue) */
  }

  /* The YES / NO text on the coin faces */
  .coin-word {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  /* Dark text on gold (good contrast), slightly different darks for each metal tone */
  .coin-yes .coin-word { color: #3a2000; text-shadow: 0 1px 2px rgba(255,255,255,0.3); }
  .coin-no  .coin-word { color: #1e2535; text-shadow: 0 1px 2px rgba(255,255,255,0.4); }

  /* Decorative inner ring — purely visual detail to make the coin
     look more like a real minted coin with an inner circle. */
  .coin-ring {
    position: absolute;
    inset: 8px;                                 /* 8px inside the coin edge */
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);    /* subtle white ring */
    pointer-events: none;                        /* doesn't interfere with tapping */
  }


  /* ── Flip Button ── */
  /* Pill-shaped gold gradient button. The gradient matches
     the coin YES face to keep the design cohesive. */
  .flip-btn {
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    border: none;
    border-radius: 50px;    /* fully rounded pill shape */
    padding: 15px 48px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    color: #1a0e00;          /* very dark brown — high contrast on gold */
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    box-shadow: 0 4px 24px rgba(212,168,67,0.35);  /* gold glow under button */
    -webkit-appearance: none;
  }

  /* Pressed state — shrinks slightly for a tactile "push" feel */
  .flip-btn:active {
    transform: scale(0.96);
    box-shadow: 0 2px 12px rgba(212,168,67,0.2);
  }

  /* Disabled while the coin is mid-flip — prevents double-tapping */
  .flip-btn:disabled { opacity: 0.5; cursor: not-allowed; }


  /* ── Flip Counter Stats (Yes / Total / No) ── */
  .stats {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .stat { text-align: center; }

  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1;
  }

  /* Each counter is coloured to match its outcome */
  .stat-num.yes   { color: var(--yes); }
  .stat-num.no    { color: var(--no);  }
  .stat-num.total { color: var(--muted); }

  .stat-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 3px;
  }

  /* Thin vertical divider line between the stat columns */
  .stat-divider {
    width: 1px;
    height: 32px;
    background: var(--border);
  }


  /* ── Quote of the Day Card ── */
  .quote-wrap {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    flex-shrink: 0;
    margin-top: 28px;     /* separation from the stats above */
    margin-bottom: 15px;  /* lifts the card up off the bottom edge of the screen */
  }

  .quote-eyebrow {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
    opacity: 0.8;
  }

  .quote-text {
    font-size: 0.82rem;
    line-height: 1.55;
    color: var(--text);
    font-style: italic;
    opacity: 0.85;
  }

  .quote-author {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 5px;
  }

  /* Shown while the API fetch is in progress */
  .quote-loading {
    color: var(--muted);
    font-size: 0.82rem;
    font-style: italic;
  }


  /* ==========================================================
    SHIMMER ANIMATION — plays after the coin lands.

    Pulses the gold drop-shadow from dim → bright → dim twice,
    creating a "glowing landing" effect. The animation is
    applied via the "landed" class which JavaScript adds right
    after the flip resolves, then removes after it finishes.
  ========================================================== */
  @keyframes shimmer {
    0%   { filter: drop-shadow(0 8px 32px rgba(212,168,67,0.3)); }  /* normal glow */
    50%  { filter: drop-shadow(0 8px 48px rgba(212,168,67,0.6))     /* brighter glow */
                   drop-shadow(0 0 20px rgba(212,168,67,0.4)); }    /* + inner halo */
    100% { filter: drop-shadow(0 8px 32px rgba(212,168,67,0.3)); }  /* back to normal */
  }

  /* "landed" is added by JS to .coin-scene (NOT .coin) after a flip,
     removed by the animationend listener. It lives on the scene
     because it animates `filter`, which would flatten .coin's 3D
     faces if applied to the rotating element.
     Plays shimmer twice (iteration count 2), starting 0.2s after landing. */
  .coin-scene.landed {
    animation: shimmer 2s ease-in-out 0.2s 2;
  }

</style>
</head>
<body>

<!-- ============================================================
  HEADER — App title and tagline
============================================================ -->
<div class="header">
  <div class="app-title">Flip It</div>
  <div class="app-sub">Yes or No · Let fate decide</div>
</div>

<!-- ============================================================
  QUESTION INPUT — user types their yes/no question here.
  maxlength="200" prevents overly long questions.
  rows="2" sets the initial visible height.
============================================================ -->
<div class="question-wrap">
  <div class="question-label">Your Question</div>
  <textarea class="question-input" placeholder="Should I…?" rows="2" maxlength="200" id="questionInput"></textarea>
</div>

<!-- ============================================================
  COIN STAGE — contains coin, result text, button, and stats
============================================================ -->
<div class="coin-stage">

  <!-- COIN STRUCTURE
       Three nested divs form the 3D coin:
       1. .coin-scene — creates the 3D perspective space (doesn't move)
       2. .coin       — the element that actually rotates
       3. .coin-face  — the two flat circular faces inside the coin

       The coin starts with class "result-yes" so the gold YES
       face is visible before the first flip.

       onclick="flipCoin()" handles mouse/desktop clicks.
       Touch events (for iPhone) are handled in JavaScript below.
  -->
  <div class="coin-scene" id="coinScene" onclick="flipCoin()">
    <div class="coin result-yes" id="coin">

      <!-- YES face (front) — gold, faces toward viewer at 0deg rotation -->
      <div class="coin-face coin-yes">
        <div class="coin-ring"></div>   <!-- decorative inner ring detail -->
        <div class="coin-word">YES</div>
      </div>

      <!-- NO face (back) — silver, pre-rotated 180deg so it faces away -->
      <div class="coin-face coin-no">
        <div class="coin-ring"></div>
        <div class="coin-word">NO</div>
      </div>

    </div>
  </div>

  <!-- FLIP BUTTON — also triggers flipCoin(), disabled mid-animation -->
  <button class="flip-btn" id="flipBtn" onclick="flipCoin()">Flip the Coin</button>

  <!-- STATS COUNTERS — updated by JavaScript after every flip -->
  <div class="stats">
    <div class="stat">
      <div class="stat-num yes" id="yesCount">0</div>
      <div class="stat-label">Yes</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-num total" id="totalCount">0</div>
      <div class="stat-label">Flips</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-num no" id="noCount">0</div>
      <div class="stat-label">No</div>
    </div>
  </div>

</div><!-- end .coin-stage -->

<!-- ============================================================
  QUOTE OF THE DAY — fetched from api.quotable.io on load.
  Shows "Loading..." initially, replaced when the API responds.
============================================================ -->
<div class="quote-wrap">
  <div class="quote-eyebrow">✦ Quote of the Day</div>
  <div class="quote-text quote-loading" id="quoteText">Loading today's wisdom…</div>
  <div class="quote-author" id="quoteAuthor"></div>
</div>


<!-- ============================================================
  MAIN JAVASCRIPT
============================================================ -->
<script>

  // ── App State Variables ────────────────────────────────────
  // These track session totals and prevent double-flipping.
  let yesCount   = 0;      // number of YES results this session
  let noCount    = 0;      // number of NO results this session
  let totalCount = 0;      // total flips (yes + no)
  let isFlipping = false;  // lock flag — true while animation plays
  let lastResult = 'yes';  // tracks last result (used for shimmer class removal)

  // Cache DOM references once so we're not querying the DOM repeatedly
  const coin    = document.getElementById('coin');
  const coinScene = document.getElementById('coinScene'); // perspective parent — holds the glow/shimmer
  const flipBtn = document.getElementById('flipBtn');
  const yesEl   = document.getElementById('yesCount');
  const noEl    = document.getElementById('noCount');
  const totalEl = document.getElementById('totalCount');


  // ── flipCoin() — Main Function ─────────────────────────────
  function flipCoin() {

    // Guard clause: exit immediately if already flipping.
    // This prevents spamming the button from triggering
    // multiple simultaneous animations.
    if (isFlipping) return;
    isFlipping = true;
    flipBtn.disabled = true;

    // ── Determine the result ──
    // Math.random() returns a float between 0 and 1.
    // Anything below 0.5 = YES, anything above = NO.
    // This gives an exact 50/50 probability.
    const result = Math.random() < 0.5 ? 'yes' : 'no';
    lastResult = result;

    // ── Calculate the final rotation angle ──
    // The animation spins 3 full rotations (1080deg) as its base.
    // YES lands face-up  = 1080deg (multiple of 360, so YES face shows)
    // NO  lands face-up  = 1080 + 180 = 1260deg (extra half-spin shows NO face)
    // This value is injected into the CSS animation via a custom property.
    const baseSpins  = 1080;
    const finalAngle = result === 'yes' ? baseSpins : baseSpins + 180;
    coin.style.setProperty('--final-rotation', finalAngle + 'deg');

    // ── Trigger the animation ──
    // Reset coin to only have base classes, then add 'flipping'
    // which applies the @keyframes coinFlip animation via CSS.
    // Resetting first is important — if we just add 'flipping'
    // without removing it first, the animation won't restart.
    coin.className = 'coin flipping';

    // ── Wait for animation to finish, then resolve ──
    // 1220ms matches the animation duration (1.2s) + a tiny buffer.
    // We can't use animationend here because we need to
    // change the class mid-animation-end to snap to final position.
    setTimeout(() => {

      // Remove the animation class and apply the correct resting state.
      // result-yes = rotateY(0deg) — YES face visible
      // result-no  = rotateY(180deg) — NO face visible
      coin.classList.remove('flipping');
      coin.classList.add(result === 'yes' ? 'result-yes' : 'result-no');

      // Add 'landed' class to the SCENE (not the coin) to trigger the
      // shimmer glow. The shimmer animates `filter`, which must stay
      // off the 3D coin element to avoid flattening its faces.
      coinScene.classList.add('landed');

      // Update session counters
      if (result === 'yes') yesCount++;
      else noCount++;
      totalCount++;
      yesEl.textContent   = yesCount;
      noEl.textContent    = noCount;
      totalEl.textContent = totalCount;

      // Release the flip lock — allow flipping again
      isFlipping = false;
      flipBtn.disabled = false;

    }, 1220); // matches animation duration
  }


  // ── Shimmer Cleanup ────────────────────────────────────────
  // The shimmer animation plays twice after landing (set in CSS).
  // Once it finishes, we remove the 'landed' class so the next
  // flip can re-add it and play the shimmer again fresh.
  // Without this, adding 'landed' a second time would have no effect
  // because the class was already present.
  coinScene.addEventListener('animationend', (e) => {
    if (e.animationName === 'shimmer') {
      coinScene.classList.remove('landed');
    }
  });


  // ── iPhone Touch Handler ───────────────────────────────────
  // onclick="flipCoin()" works fine on desktop.
  // On iPhone we need touch events to prevent the 300ms tap delay
  // and to distinguish a tap from a scroll gesture.
  //
  // touchMoved tracks whether the finger moved between touchstart
  // and touchend. If it moved, the user was scrolling — don't flip.
  // If it didn't move, it was a tap — flip the coin.
  //
  // e.preventDefault() stops the browser firing a synthetic
  // click event after the touch, which would call flipCoin() twice.
  // { passive: false } is required to allow preventDefault() on touchend.
  let touchMoved = false;
  document.getElementById('coinScene').addEventListener('touchstart', () => touchMoved = false);
  document.getElementById('coinScene').addEventListener('touchmove',  () => touchMoved = true);
  document.getElementById('coinScene').addEventListener('touchend', (e) => {
    if (!touchMoved) {
      e.preventDefault(); // prevent duplicate click event
      flipCoin();
    }
  }, { passive: false });


  // ── Quote of the Day ───────────────────────────────────────
  // Fetches a random inspirational quote from api.quotable.io
  // — a free, open-source API with full CORS support (works
  // directly from the browser with no API key required).
  //
  // CACHING STRATEGY:
  // To avoid hitting the API every time the app opens, we store
  // the fetched quote in localStorage (your phone's persistent
  // key-value storage) along with today's date. On each load,
  // we check: does a cached quote exist AND is it from today?
  // If yes → show the cached quote instantly (no network needed).
  // If no  → fetch a fresh quote, then cache it for the rest of the day.
  async function loadQuote() {
    const cacheKey  = 'flipit_quote_v2';       // key for the stored quote object
    const cacheDate = 'flipit_quote_date_v2';  // key for the stored date string
    const today     = new Date().toDateString(); // e.g. "Sat Jun 06 2026"
    const quoteEl   = document.getElementById('quoteText');
    const authorEl  = document.getElementById('quoteAuthor');

    // Helper function: display a quote and remove the loading style
    function showQuote(content, author) {
      quoteEl.textContent = `"${content}"`;
      quoteEl.classList.remove('quote-loading'); // removes the muted/italic loading style
      authorEl.textContent = `— ${author}`;
    }

    // Check localStorage cache first
    try {
      const cached     = localStorage.getItem(cacheKey);
      const cachedDate = localStorage.getItem(cacheDate);
      if (cached && cachedDate === today) {
        // Cache is valid for today — show it without any network request
        const q = JSON.parse(cached);
        showQuote(q.content, q.author);
        return; // exit early, no need to fetch
      }
    } catch {} // localStorage can fail in private browsing — fail silently

    // No valid cache — fetch from the API
    // maxLength=120 keeps quotes short enough to fit the card
    try {
      const res  = await fetch('https://api.quotable.io/quotes/random?maxLength=120');
      if (!res.ok) throw new Error('API error'); // treat non-200 responses as failures
      const data = await res.json();
      const q    = data[0]; // API returns an array, we take the first item

      // Save to cache so tomorrow this branch runs only once
      try {
        localStorage.setItem(cacheKey,  JSON.stringify({ content: q.content, author: q.author }));
        localStorage.setItem(cacheDate, today);
      } catch {} // if localStorage is full or blocked, just skip caching

      showQuote(q.content, q.author);

    } catch {
      // API is unreachable (no internet, API down, etc.)
      // Fall back to hardcoded quotes so the card is never empty.
      // These are baked directly into the code — no network needed.
      const fallbacks = [
        { content: "The universe is under no obligation to make sense to you.", author: "Neil deGrasse Tyson" },
        { content: "Indecision is the thief of opportunity.",                   author: "Jim Rohn" },
        { content: "When in doubt, flip a coin. At least you'll know what you were hoping for.", author: "Unknown" },
        { content: "Sometimes the smallest decision can change your life forever.", author: "Keri Russell" },
        { content: "Your life is the sum result of all the choices you make.",  author: "Wayne Dyer" },
      ];
      // Pick a random one from the list
      const f = fallbacks[Math.floor(Math.random() * fallbacks.length)];
      showQuote(f.content, f.author);
    }
  }

  // Run loadQuote as soon as the script executes
  loadQuote();

</script>


<!-- ============================================================
  PWA SERVICE WORKER (inline blob method)

  A Service Worker is a background script that can intercept
  network requests and cache resources for offline use.
  Normally it lives in a separate .js file, but since we're
  a single HTML file, we embed the code as a string, convert
  it to a Blob (an in-memory file), then register that.

  What this worker does:
  - On "install": caches the root page ('/') so it loads offline
  - On "fetch": tries the network first; if that fails (offline),
    serves the cached version instead

  This is what makes the app work after being added to your
  home screen with no internet connection.

  Note: Blob-based service workers may have limited scope in
  some browsers — uploading to GitHub Pages resolves this.
============================================================ -->
<script>
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'flipit-v1';
    const ASSETS = ['/'];

    /* Install event: pre-cache the app shell */
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
      self.skipWaiting(); /* activate immediately, don't wait for old SW to die */
    });

    /* Fetch event: network-first, cache fallback */
    self.addEventListener('fetch', e => {
      e.respondWith(
        fetch(e.request).catch(() => caches.match(e.request))
      );
    });
  `;
  const blob  = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob); // creates a temporary in-memory URL
  navigator.serviceWorker.register(swUrl).catch(() => {}); // fail silently if blocked
}
</script>


<!-- ============================================================
  PWA MANIFEST (inline blob method)

  The Web App Manifest is a JSON file that tells the browser
  how the app should behave when installed on a home screen:
  its name, colours, orientation, and icon.

  Normally this is a separate manifest.json file linked in the
  <head>, but we generate it as a Blob here so everything stays
  in one HTML file.

  Key properties:
  - display: "standalone" — hides the browser chrome (no address bar)
  - icons: the home screen icon — here it's an inline SVG data URL
    so we don't need a separate image file
============================================================ -->
<script>
const manifest = {
  name:             "Flip It — Yes or No",
  short_name:       "Flip It",      // label under home screen icon
  start_url:        ".",            // opens from the root when launched
  display:          "standalone",   // full-screen, no browser UI
  background_color: "#0a0a12",      // splash screen background before app loads
  theme_color:      "#0a0a12",      // status bar / browser chrome colour
  orientation:      "portrait",     // lock to portrait orientation
  icons: [{
    // Inline SVG icon — a gold circle with "Y" on a dark background.
    // Using a data URL avoids needing a separate icon file.
    src: "data:image/svg+xml," + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>
        <rect width='512' height='512' rx='100' fill='%230a0a12'/>
        <circle cx='256' cy='256' r='180' fill='%23d4a843'/>
        <circle cx='256' cy='256' r='160' fill='none' stroke='%23f0c96a' stroke-width='8'/>
        <text x='256' y='300' text-anchor='middle' font-family='Georgia,serif'
              font-size='120' font-weight='900' fill='%231a0e00'>Y</text>
      </svg>`
    ),
    sizes: "512x512",
    type:  "image/svg+xml"
  }]
};

// Convert the manifest object to a JSON Blob and inject it as a <link> tag
const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
const url  = URL.createObjectURL(blob);
const link = document.createElement('link');
link.rel   = 'manifest';
link.href  = url;
document.head.appendChild(link);
</script>
